name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: The tests
        run: python -I run_tests.py
      - name: The whole demo
        run: python -I demo.py --out demo-run
      - name: The examples and the picture, made again and compared
        run: python -I make_examples.py --check
      - name: The data, the requests, the constructed answers and the test list, made again and compared
        run: |
          python -I data/generate.py --check
          python -I tools/recordings.py requests --check
          python -I tools/recordings.py construct --check
          python -I tools/list_tests.py --check
      - name: Nothing tracked was changed by the run
        run: git diff --exit-code
